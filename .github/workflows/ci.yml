name: CI
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: draxmax:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          mkdir -p data/config data/downloads data/watch
          docker run -d --name draxmax -p 8895:8895 -e TORRENT_PORT=0 -v "$PWD/data/config:/config" draxmax:ci
          for i in $(seq 1 30); do curl -fs localhost:8895/api/health && exit 0; sleep 1; done
          docker logs draxmax; exit 1
